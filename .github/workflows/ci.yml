name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: python3 -m py_compile admiral.py harness.py tests/run.py tests/harness_drive.py
      - run: uv run tests/unit.py
